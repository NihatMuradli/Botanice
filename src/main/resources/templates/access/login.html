<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/css/access/style.css">
    <link rel="icon" type="image/x-icon" href="../../static/images/botanic-e-icon-green.png">
    <script src="https://kit.fontawesome.com/cfe474865a.js" crossorigin="anonymous"></script>
    <script src="../../static/js/access/login.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Ubuntu' rel='stylesheet'>
    <title>Log in to Botanic-e</title>
</head>
<body>

<div class="alert">
    <div class="alert-text">Password or Username is false.</div>
    <button class="delete-btn"> <i class="fa-solid fa-x"> </i></button>
</div>

<div class="wrapper">
    <div class="login-box">
        <h1 class="title">Log In</h1>
        <form id="form" method="post">
            <div class="input-box">
                <span class="icon"><i class="fa-solid fa-user"></i></span>
                <input id="username" name="username" type="text" required>
                <label for="username">Username</label>
            </div>
            <div class="input-box">
                <span class="icon"><i class="fa-solid fa-lock"></i></span>
                <input id="password" name="password" type="password" required>
                <label for="password">Password</label>
            </div>
            <div class="remember">
                <label>
                    <input name="remembering" type="checkbox">
                    Remember me
                </label>
            </div>
            <input value="Log in" class="btn" name="submit" type="submit">
            <p class="signup-link">Don't have an account? <a href="signup.html"><b>Sign Up!</b></a></p>
        </form>
    </div>
    <div class="logo-container">
        <img src="../../static/images/Botanic-e.png" alt="logo" class="logo">
    </div>
</div>

</body>
</html>
